name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The raw Kaggle dump is 1.3 GB and is not committed, so the end-to-end
      # checks skip here (see tests/conftest.py) and the rest still run: the site
      # in sync with the parts it is built from, every decision citing a diagnostic
      # that exists, every referenced figure present. Those caught the real bugs.
      - run: python -m pytest -q -rs
